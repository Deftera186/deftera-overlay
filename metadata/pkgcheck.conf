# Repo-level pkgcheck configuration.
#
# Suppress NonexistentDeps / NonsolvableDeps* warnings caused by
# sys-apps/pnpm-bin: that package lives in the ::guru overlay, and the
# deftera overlay only declares ::gentoo as a master. Users are
# expected to enable ::guru to build games-util/deadlock-modmanager
# from source. See README.md for details.
[deftera]
keywords = -NonexistentDeps,-NonsolvableDepsInDev,-NonsolvableDepsInStable,-NonsolvableDepsInExp
